name: Custom Build

on:
  workflow_dispatch:
    inputs:
      cn:
        description: 'Include Chinese version (add "--cn" to build args)'
        required: false
        default: false
        type: boolean
      normal:
        description: 'Remove opinionated features (add "--normal" to build args)'
        required: false
        default: false
        type: boolean
      no_liga:
        description: 'Remove ligatures (add "--no-liga" to build args)'
        required: false
        default: false
        type: boolean
      no_hinted:
        description: 'Build unhinted font (add "--no-hinted" to build args)'
        required: false
        default: false
        type: boolean
      nf_mono:
        description: 'Fixed Nerd Font icon width (add "--nf-mono" to build args)'
        required: false
        default: false
        type: boolean
      feat:
        description: 'Enable features, split by `,`, e.g. "cv01,ss02" (add "--feat feat1,feat2" to build args)'
        required: false
        default: ''
        type: string
      build_args:
        description: 'Other args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
          # Install fontforge if needed (Patching logic)
          if [[ "${{ github.event.inputs.build_args }}" == *"--font-patcher"* ]] || python build.py --dry | jq -e '.nerd_font.use_font_patcher == true' >/dev/null; then
            sudo apt update -y -q
            sudo apt install software-properties-common -y -q
            sudo apt install python3-fontforge -y -q
            sudo apt install fuse -y -q
            curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
            chmod u+x fontforge
            export PATH=`pwd`:$PATH
            echo "PATH=$PATH" >> $GITHUB_ENV
          fi

          # [NEW] Install NFPM for packaging (deb, rpm, arch)
          echo "Installing NFPM..."
          mkdir -p bin
          curl -sfL https://install.goreleaser.com/github.com/goreleaser/nfpm.sh | sh -s -- -b ./bin

      - name: Run custom script and Package
        run: |
          # 1. Construct Build Arguments
          build_args="--archive"
          if [ "${{ github.event.inputs.cn }}" == "true" ]; then
            build_args="$build_args --cn"
          fi
          if [ "${{ github.event.inputs.normal }}" == "true" ]; then
            build_args="$build_args --normal"
          fi
          if [ "${{ github.event.inputs.no_liga }}" == "true" ]; then
            build_args="$build_args --no-liga"
          fi
          if [ "${{ github.event.inputs.no_hinted }}" == "true" ]; then
            build_args="$build_args --no-hinted"
          fi
          if [ "${{ github.event.inputs.nf_mono }}" == "true" ]; then
            build_args="$build_args --nf-mono"
          fi
          if [ -n "${{ github.event.inputs.feat }}" ]; then
            build_args="$build_args --feat ${{ github.event.inputs.feat }}"
          fi
          if [ -n "${{ github.event.inputs.build_args }}" ]; then
            build_args="$build_args ${{ github.event.inputs.build_args }}"
          fi

          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          
          # 2. Run the Python Build
          python build.py $build_args

          # 3. Post-Processing: Repackage for Linux/Nix
          # Define Version based on date (or you can parse it from config)
          VERSION=$(date +'%Y.%m.%d')
          echo "Using Version: $VERSION"

          # Prepare staging area
          mkdir -p package_staging
          # Unzip the artifact generated by build.py to get raw files
          # Assuming build.py output is the only zip in fonts/archive
          unzip -q fonts/archive/*.zip -d package_staging/
          
          # Get the inner directory name (e.g. MapleMono-NF-CN-unhinted)
          cd package_staging
          DIR_NAME=$(ls -d */ | head -n 1 | tr -d /)
          echo "Inner directory found: $DIR_NAME"
          
          # [Target 1] Create .tar.gz (Standard for Nix fetchurl)
          tar -czvf ../maple-mono.tar.gz "$DIR_NAME"
          
          # [Target 2,3,4] Create Deb, RPM, Arch using NFPM
          # Generate configuration file on the fly
          cat << EOF > ../nfpm.yaml
          name: "maple-mono"
          arch: "all"
          platform: "linux"
          version: "${VERSION}"
          section: "fonts"
          priority: "optional"
          maintainer: "GitHub Action <action@github.com>"
          description: "Maple Mono Font (Custom Build)"
          vendor: "Maple Mono"
          license: "OFL-1.1"
          contents:
          - src: "./package_staging/$DIR_NAME/*.ttf"
            dst: "/usr/share/fonts/truetype/maple-mono/"
          - src: "./package_staging/$DIR_NAME/LICENSE.txt"
            dst: "/usr/share/doc/maple-mono/LICENSE"
          EOF
          
          cd ..
          
          # Execute NFPM
          ./bin/nfpm pkg --packager deb --target fonts/archive/MapleMono-${VERSION}.deb
          ./bin/nfpm pkg --packager rpm --target fonts/archive/MapleMono-${VERSION}.rpm
          ./bin/nfpm pkg --packager arch --target fonts/archive/MapleMono-${VERSION}.pkg.tar.zst
          
          # Move tar.gz to archive folder
          mv maple-mono.tar.gz fonts/archive/MapleMono-${VERSION}.tar.gz
          
          # Cleanup
          rm -rf package_staging nfpm.yaml bin

      - id: check_issue
        name: Check issue feature file
        run: |
          if [ -f fonts/issue.fea ]; then
            echo 'exists=true' >> $GITHUB_OUTPUT
          else
            echo 'exists=false' >> $GITHUB_OUTPUT
          fi

      - name: Upload issue artifact
        if: ${{ steps.check_issue.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fea-file
          path: fonts/issue.fea

      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Failed to build font, please check [Run custom script] step."
            exit 1
          fi
          
          echo "### Build arguments" >> NOTES
          echo "\`\`\`" >> NOTES
          echo "python build.py $BUILD_ARGS" >> NOTES
          echo "\`\`\`" >> NOTES
          
          echo "### Final Configuration" >> NOTES
          echo "\`\`\`" >> NOTES
          # Use '|| true' to prevent failure if --dry isn't supported or fails
          (python build.py $BUILD_ARGS --dry | sed '1s/^/font_config: /') || echo "Config dump failed" >> NOTES
          echo "\`\`\`" >> NOTES
          
          # Release all files in fonts/archive (zips, deb, rpm, arch, tar.gz)
          gh release create "v$(date +%s)" fonts/archive/*.* --notes-file NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
